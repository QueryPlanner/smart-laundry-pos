[package]
name = "smart-laundry-pos"
version = "0.8.0"
description = "Smart Laundry POS desktop application"
authors = ["Smart Laundry"]
edition = "2021"
build = "build.rs"

[lib]
name = "smart_laundry_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.7.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["pdf"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Storage_Xps"] }
